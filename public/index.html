
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validador de Cédula Dominicana</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="contenedor">

        <h1>Validador de Cédula Dominicana</h1>

        <p class="descripcion">
            Ingresa los 11 dígitos de tu cédula para comprobar
            su validez mediante el algoritmo módulo 10.
        </p>

        <form id="formCedula">

            <label for="cedula">Número de cédula:</label>

            <input
                type="text"
                id="cedula"
                name="cedula"
                placeholder="Ejemplo: 12345678911"
                maxlength="11"
                inputmode="numeric"
                autocomplete="off"
                required
            >

            <button type="submit">Validar cédula</button>

        </form>

        <div id="resultado" class="resultado" role="status" aria-live="polite"></div>

        <p class="nota">
            comprueba el dígito verificador mediante
            el algoritmo módulo 10.
        </p>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
